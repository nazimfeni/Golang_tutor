openapi: 3.0.0
info:
  title: My First API
  description: Simple Swagger API Demo
  version: 1.0.0

servers:
  - url: http://localhost:8080

paths:
  /hello:
    get:
      summary: Hello API
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Hello World
